<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AnimeRater - Browse Top Anime</title>
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <h1>AnimeRater</h1>
  <div class="search-bar">
    <input
      type="search"
      id="search"
      class="search-input"
      placeholder="Search anime..."
      aria-label="Search"
      autocomplete="off"
    >
    <button id="filter-btn" type="button" aria-label="Filter ongoing anime">⚙️</button>
    <button id="search-btn" type="button" aria-label="Search">🔍</button>
    

  </div>
  <div class="pagination-top">
    <button id="prev" disabled>&larr; Prev</button>
    <span id="page">Page 1</span>
    <button id="next">Next &rarr;</button>
  </div>
  <div id="grid" class="grid"></div>
  
  <div class="pagination-bottom">
    <button id="prev" disabled>&larr; Prev</button>
    <span id="page">Page 1</span>
    <button id="next">Next &rarr;</button>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="static/script.js"></script>
</body>
</html>
