<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AnimeRater - Browse Top Anime</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>AnimeRater</h1>
  <div class = "top-bar">
      <button id="login-btn" type="button" aria-haspopup="dialog">Log in</button>
      <span id="account" class="account" hidden>
        <span class="account-name">Signed in as <strong id="account-name"></strong></span>
        <button id="logout-btn" type="button">Log out</button>
      </span>
      <button id="settings-btn" type="button" aria-haspopup="dialog" aria-label="Settings">⚙️
      Customize</button>
  </div>
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true"
  aria-labelledby="settings-title">
    <div class="modal-box">
      <button id="settings-close" aria-label="Close settings">&times;</button>
      <h2 id="settings-title">Settings</h2>
  
      <fieldset class="settings-group">
        <legend>Background</legend>
        <div class="bg-options" role="radiogroup" aria-label="Background theme">
          <button class="bg-option" type="button" data-bg="navy"    aria-pressed="true">Navy</button>
          <button class="bg-option" type="button" data-bg="aurora"  aria-pressed="false">Aurora</button>
          <button class="bg-option" type="button" data-bg="sunset"  aria-pressed="false">Sunset</button>
          <button class="bg-option" type="button" data-bg="forest"  aria-pressed="false">Forest</button>
        </div>
      </fieldset>
    </div>
  </div>
  <div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true"
    aria-labelledby="auth-title">
      <div class="modal-box">
        <button id="auth-close" aria-label="Close login">&times;</button>
        <h2 id="auth-title">Log in</h2>
  
        <form id="auth-form" novalidate>
          <label class="field">
            <span>Username</span>
            <input id="auth-username" name="username" type="text" autocomplete="username"
                   minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input id="auth-password" name="password" type="password"
                   autocomplete="current-password" maxlength="128" required>
          </label>
  
          <p id="auth-error" class="auth-error" role="alert" hidden></p>
  
          <button id="auth-submit" type="submit">Log in</button>
        </form>
  
        <p class="auth-switch">
          <span id="auth-switch-text">Don't have an account?</span>
          <button id="auth-switch-btn" type="button" class="linkish">Sign up</button>
        </p>
      </div>
    </div>
  <div class="search-bar">
    <input
      type="search"
      id="search"
      class="search-input"
      placeholder="Search anime..."
      aria-label="Search"
      autocomplete="off"
    >
    <button id="filter-btn" type="button" aria-label="Filter ongoing anime">Filter</button>
    <button id="search-btn" type="button" aria-label="Search">🔍</button>
    

  </div>
  <div class="view-controls" role="group" aria-label="Anime view">
    <button id="all-anime" type="button" aria-pressed="true" aria-controls="grid">All Anime</button>
    <button id="favorites" type="button" aria-pressed="false" aria-controls="grid">Favorites</button>
  </div>
  <p id="storage-notice" class="storage-notice" role="status" hidden></p>
  <div class="pagination-top">
    <button class="prev" disabled>&larr; Prev</button>
    <span class="page">Page 1</span>
    <button class="next">Next &rarr;</button>
  </div>
  <div id="grid" class="grid"></div>
  
  <div class="pagination-bottom">
    <button class="prev" disabled>&larr; Prev</button>
    <span class="page">Page 1</span>
    <button class="next">Next &rarr;</button>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
